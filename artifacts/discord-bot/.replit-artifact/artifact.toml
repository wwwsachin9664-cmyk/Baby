kind = "web"
previewPath = "/discord-bot/"
title = "Discord Bot"
version = "1.0.0"
id = "artifacts/discord-bot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "Discord Bot"
paths = ["/discord-bot/"]
localPort = 20320

[services.development]
run = "cd /home/runner/workspace && python run.py"

[services.production]

[services.production.build]
args = ["sh", "-c", "rm -rf /home/runner/workspace/node_modules /home/runner/workspace/artifacts/discord-bot/node_modules /home/runner/workspace/artifacts/mockup-sandbox/node_modules 2>/dev/null; true"]

[services.production.run]
args = ["python", "run.py"]

[services.production.health.startup]
path = "/discord-bot/"

[services.env]
PORT = "20320"
BASE_PATH = "/discord-bot/"
